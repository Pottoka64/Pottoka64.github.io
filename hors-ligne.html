<!doctype html>
<html lang="fr" class="antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#140f0c" />
    <meta name="robots" content="noindex" />
    <title>Hors ligne — OCHE</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap"
    />
    <style>
      :root {
        --bg: #140f0c;
        --fg: #f6efe4;
        --muted: #b7ab9b;
        --cream: #f0d9a6;
        --red: #e23b32;
        --green: #1f8f5a;
        --inset: #0c0a09;
        --raised: #2a211c;
        --surface: #1f1814;
        --line: #f6efe42e;
        --font: "Barlow", ui-sans-serif, system-ui, sans-serif;
        --display: "Barlow Condensed", "Barlow", ui-sans-serif, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        background-image: radial-gradient(ellipse at 50% -10%, #e23b3226, transparent 50%),
          radial-gradient(ellipse at 80% 110%, #1f8f5a22, transparent 45%);
      }
      main { max-width: 26rem; text-align: center; }
      .logo { display: inline-flex; align-items: center; gap: 0.65rem; text-decoration: none; color: var(--cream); }
      .logo svg { width: 2.25rem; height: 2.25rem; }
      .logo span { font-family: var(--display); font-size: 1.75rem; font-weight: 600; letter-spacing: 0.16em; }
      h1 {
        font-family: var(--display);
        font-size: 2.25rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin: 1.75rem 0 0.75rem;
        color: var(--cream);
      }
      p { margin: 0 0 1.5rem; color: var(--muted); line-height: 1.5; font-size: 1.05rem; }
      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0.55rem 1.2rem;
        border: 2px solid var(--red);
        background: var(--red);
        color: var(--fg);
        font-family: var(--display);
        font-weight: 700;
        font-size: 1.05rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
        box-shadow: 4px 4px 0 0 var(--cream);
      }
      a.btn:hover { transform: translate(-1px, -1px); box-shadow: 6px 6px 0 0 var(--cream); }
    </style>
  </head>
  <body>
    <main>
      <a class="logo" href="/" aria-label="OCHE, accueil">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="15" fill="#0c0a09"/>
          <circle cx="16" cy="16" r="12" fill="#f0d9a6"/>
          <path fill="#0c0a09" d="M16 16 L16 4 A12 12 0 0 1 28 16 Z"/>
          <path fill="#0c0a09" d="M16 16 L16 28 A12 12 0 0 1 4 16 Z"/>
          <circle cx="16" cy="16" r="12" fill="none" stroke="#e23b32" stroke-width="2.2"/>
          <circle cx="16" cy="16" r="7.2" fill="none" stroke="#1f8f5a" stroke-width="2"/>
          <circle cx="16" cy="16" r="2.4" fill="#e23b32"/>
          <circle cx="16" cy="16" r="1" fill="#f0d9a6"/>
        </svg>
        <span>OCHE</span>
      </a>
      <h1>Hors ligne</h1>
      <p>Pas de connexion pour le moment. Les tournois déjà ouverts sur cet appareil restent dans la mémoire du navigateur. Réessaie dès que le réseau revient.</p>
      <a class="btn" href="/">Réessayer</a>
    </main>
  </body>
</html>
